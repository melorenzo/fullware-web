services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://fullware.com.ar}
        PUBLIC_WHATSAPP_NUMBER: ${PUBLIC_WHATSAPP_NUMBER:-}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/fullware.sqlite
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
